name: Fix 0.9.7 UI runtime lifecycle

on:
  push:
    branches:
      - release/0.9.7-ios-health-check

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Make UI modules browser-only and version module pure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # app-version.js must remain a pure metadata module. UI side effects belong to main.js.
          app = Path('src/app-version.js')
          text = app.read_text()
          text = text.replace('import "./ui-shell.js";\n', '')
          text = text.replace('import "./ui-reference-layer.js";\n', '')
          app.write_text(text)

          main = Path('src/main.js')
          text = main.read_text()
          marker = 'import { APP_VERSION } from "./app-version.js";\n'
          prefix = 'import "./ui-shell.js";\nimport "./ui-reference-layer.js";\n'
          if prefix not in text:
              if marker not in text:
                  raise SystemExit('main.js APP_VERSION import anchor not found')
              text = text.replace(marker, prefix + marker, 1)
          main.write_text(text)

          shell = Path('src/ui-shell.js')
          text = shell.read_text()
          old = '''let syncScheduled=false;
          function syncAll(){
            syncHealth();
            syncLiveCore();
            syncLiveStatus();
            applyLiveMetricFilter();
          }
          function scheduleSync(){
            if(syncScheduled)return;
            syncScheduled=true;
            const run=()=>{syncScheduled=false;syncAll();};
            if(typeof requestAnimationFrame==="function")requestAnimationFrame(run);else setTimeout(run,0);
          }

          installStyle();
          installPages();
          installNavigation();
          installSubpageBackButtons();
          installRouting();
          enhanceLive();
          new MutationObserver(scheduleSync).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["class"]});
          setInterval(scheduleSync,1500);
          queueMicrotask(scheduleSync);'''.replace('          ', '')
          new = '''let syncScheduled=false;
          function hasDom(){
            return typeof document!=="undefined"&&Boolean(document?.body);
          }
          function syncAll(){
            if(!hasDom())return;
            syncHealth();
            syncLiveCore();
            syncLiveStatus();
            applyLiveMetricFilter();
          }
          function scheduleSync(){
            if(!hasDom()||syncScheduled)return;
            syncScheduled=true;
            const run=()=>{
              syncScheduled=false;
              if(!hasDom())return;
              syncAll();
            };
            if(typeof requestAnimationFrame==="function")requestAnimationFrame(run);else setTimeout(run,0);
          }

          function bootUiShell(){
            if(!hasDom())return;
            installStyle();
            installPages();
            installNavigation();
            installSubpageBackButtons();
            installRouting();
            enhanceLive();
            if(typeof MutationObserver==="function"){
              new MutationObserver(scheduleSync).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["class"]});
            }
            queueMicrotask(scheduleSync);
          }

          bootUiShell();'''.replace('          ', '')
          if old not in text:
              raise SystemExit('ui-shell lifecycle anchor not found')
          shell.write_text(text.replace(old, new, 1))

          refs = Path('src/ui-reference-layer.js')
          text = refs.read_text()
          old = '''let scheduled=false;
          function syncReferences(){
            scheduled=false;
            annotateCoreCards();
            annotateRawMetricCards();
            updateReferenceSummary();
            updateHealthRowsFromReferences();
          }
          function schedule(){
            if(scheduled)return;
            scheduled=true;
            const run=()=>syncReferences();
            if(typeof requestAnimationFrame==="function")requestAnimationFrame(run);else setTimeout(run,0);
          }

          ensureReferenceStyles();
          new MutationObserver(schedule).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["class"]});
          setInterval(schedule,1700);
          queueMicrotask(schedule);'''.replace('          ', '')
          new = '''let scheduled=false;
          function hasDom(){
            return typeof document!=="undefined"&&Boolean(document?.body);
          }
          function syncReferences(){
            scheduled=false;
            if(!hasDom())return;
            annotateCoreCards();
            annotateRawMetricCards();
            updateReferenceSummary();
            updateHealthRowsFromReferences();
          }
          function schedule(){
            if(!hasDom()||scheduled)return;
            scheduled=true;
            const run=()=>{
              if(!hasDom()){scheduled=false;return;}
              syncReferences();
            };
            if(typeof requestAnimationFrame==="function")requestAnimationFrame(run);else setTimeout(run,0);
          }

          function bootReferenceLayer(){
            if(!hasDom())return;
            ensureReferenceStyles();
            if(typeof MutationObserver==="function"){
              new MutationObserver(schedule).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["class"]});
            }
            queueMicrotask(schedule);
          }

          bootReferenceLayer();'''.replace('          ', '')
          if old not in text:
              raise SystemExit('ui-reference-layer lifecycle anchor not found')
          refs.write_text(text.replace(old, new, 1))

          # Remove this one-shot workflow from the resulting commit.
          Path('.github/workflows/fix-ui-runtime-release.yml').unlink()
          PY
      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app-version.js src/main.js src/ui-shell.js src/ui-reference-layer.js .github/workflows/fix-ui-runtime-release.yml
          git commit -m "Fix UI browser lifecycle for 0.9.7"
          git push origin HEAD:${GITHUB_REF_NAME}
