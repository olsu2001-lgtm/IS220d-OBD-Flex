name: Prepare Flex 0.9.7

on:
  push:
    branches:
      - release/0.9.7-ios-health-check

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Allocate next registered version
        run: npm run version:next
      - name: Verify expected version
        run: node -e 'const p=require("./package.json"); if(p.version!=="0.9.7") throw new Error(`Expected 0.9.7, got ${p.version}`)'
      - name: Commit version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release 0.9.7 version allocation"
          git push origin HEAD:${GITHUB_REF_NAME}
