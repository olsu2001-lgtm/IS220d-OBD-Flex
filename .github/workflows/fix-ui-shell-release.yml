name: Fix release UI shell syntax

on:
  push:
    branches:
      - release/0.9.7-ios-health-check

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Correct malformed Health Check call and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui-shell.js')
          text = path.read_text()
          old = 'else if(dtc.codes.length) status(rows.engine,"fault",`${dtc.codes.length} vikakoodia","Avaa Vikakoodit nähdäksesi löydökset");'
          new = 'else if(dtc.codes.length) status(rows.engine,"fault",`${dtc.codes.length} vikakoodia`,"Avaa Vikakoodit nähdäksesi löydökset");'
          if old not in text:
              raise SystemExit('Expected malformed UI-shell line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-ui-shell-release.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-shell.js .github/workflows/fix-ui-shell-release.yml
          git commit -m "Fix Health Check UI shell syntax"
          git push origin HEAD:${GITHUB_REF_NAME}
