name: Flex safety and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One queue for all release branches; registry writes also compare the blob SHA.
concurrency:
  group: flex-release
  cancel-in-progress: false

jobs:
  test-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FLEX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression and safety tests
        run: npm test
      # Main merges run tests only: reuse the registered APK instead of rebuilding
      # the same version with a new timestamp or signature.
      - name: Check shared release registry
        if: github.event_name != 'push'
        run: npm run release:check
      - name: Build and verify debug and release APKs
        if: github.event_name != 'push'
        run: npm run build
      - name: Register exact APK hashes before distribution
        if: github.event_name != 'push'
        run: npm run release:register
      - name: Read registered version
        if: github.event_name != 'push'
        id: app_version
        run: node -e 'const fs=require("fs"); const info=require("./dist/release-registration.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${info.versionName}\n`);'
      - name: Upload registered APK artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Lexus-OBD-Flex-${{ steps.app_version.outputs.value }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/Lexus_OBD-Flex-*.apk
            dist/build-info.json
            dist/release-registration.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
