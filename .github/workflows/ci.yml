name: Flex safety and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression and safety tests
        run: npm test

      - name: Build debug and release APKs
        run: npm run build

      - name: Verify APK structure, version, signature and provenance
        run: |
          set -euo pipefail
          DEBUG_APK=dist/Lexus_OBD-Flex-0.8.1-debug.apk
          RELEASE_APK=dist/Lexus_OBD-Flex-0.8.1-release.apk
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s dist/build-info.json
          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$RELEASE_APK" | grep -F "package: name='fi.oliver.is220dobd' versionCode='801' versionName='0.8.1'"
          node -e 'const fs=require("fs"); const info=JSON.parse(fs.readFileSync("dist/build-info.json","utf8")); if(info.gitSha!==process.env.GITHUB_SHA) throw new Error(`build-info SHA ${info.gitSha} != ${process.env.GITHUB_SHA}`); if(info.appVersion!=="0.8.1") throw new Error(`unexpected appVersion ${info.appVersion}`);'
          SHORT_SHA="${GITHUB_SHA:0:12}"
          unzip -p "$DEBUG_APK" assets/app.bundle.js | grep -Fq "$SHORT_SHA"
          unzip -p "$RELEASE_APK" assets/app.bundle.js | grep -Fq "$SHORT_SHA"

      - name: Upload field-validation APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexus-OBD-Flex-0.8.1-${{ github.sha }}
          path: |
            dist/Lexus_OBD-Flex-0.8.1-debug.apk
            dist/Lexus_OBD-Flex-0.8.1-release.apk
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
