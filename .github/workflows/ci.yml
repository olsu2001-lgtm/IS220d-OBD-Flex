name: Flex safety and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression and safety tests
        run: npm test

      - name: Build debug and release APKs
        run: npm run build

      - name: Verify generated APKs
        run: |
          test -s dist/IS220d_OBD-Flex-0.6.9-debug.apk
          test -s dist/IS220d_OBD-Flex-0.6.9-release.apk

