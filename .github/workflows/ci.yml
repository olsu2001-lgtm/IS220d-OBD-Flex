name: Flex safety and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression and safety tests
        run: npm test

      - name: Build debug and release APKs
        run: npm run build

      - name: Verify APK structure, version, signature and provenance
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e 'const [a,b,c]=require("./package.json").version.split(".").map(Number); process.stdout.write(String(a*10000+b*100+c));')
          DEBUG_APK="dist/Lexus_OBD-Flex-${APP_VERSION}-debug.apk"
          RELEASE_APK="dist/Lexus_OBD-Flex-${APP_VERSION}-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s dist/build-info.json
          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$RELEASE_APK" | grep -F "package: name='fi.oliver.is220dobd' versionCode='${VERSION_CODE}' versionName='${APP_VERSION}'"
          node -e 'const fs=require("fs"); const pkg=require("./package.json"); const info=JSON.parse(fs.readFileSync("dist/build-info.json","utf8")); if(info.gitSha!==process.env.GITHUB_SHA) throw new Error(`build-info SHA ${info.gitSha} != ${process.env.GITHUB_SHA}`); if(info.appVersion!==pkg.version) throw new Error(`unexpected appVersion ${info.appVersion} != ${pkg.version}`); const expected=[`Lexus_OBD-Flex-${pkg.version}-debug.apk`,`Lexus_OBD-Flex-${pkg.version}-release.apk`]; if(JSON.stringify(info.outputs)!==JSON.stringify(expected)) throw new Error(`unexpected outputs ${JSON.stringify(info.outputs)}`);'
          SHORT_SHA="${GITHUB_SHA:0:12}"
          unzip -p "$DEBUG_APK" assets/app.bundle.js | grep -Fq "$SHORT_SHA"
          unzip -p "$RELEASE_APK" assets/app.bundle.js | grep -Fq "$SHORT_SHA"

      - name: Upload field-validation APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexus-OBD-Flex-${{ steps.app_version.outputs.value }}-${{ github.sha }}
          path: |
            dist/Lexus_OBD-Flex-${{ steps.app_version.outputs.value }}-debug.apk
            dist/Lexus_OBD-Flex-${{ steps.app_version.outputs.value }}-release.apk
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
