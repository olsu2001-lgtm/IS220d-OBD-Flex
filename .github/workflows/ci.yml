name: Flex safety and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Build, register and upload a new APK release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# Source-review PRs must be cheap and safe for any development agent. APK publication
# is opt-in: either use a release/* branch or manually dispatch with publish=true.
# The shared release registry still serializes and rejects reused version identities.
concurrency:
  group: flex-release
  cancel-in-progress: false

jobs:
  test-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FLEX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FLEX_PUBLISH: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression and safety tests
        run: npm test

      # Normal fix/feature/work branches stop here. This allows source review without
      # consuming a version number or accidentally publishing an APK.
      - name: Check shared release registry
        if: env.FLEX_PUBLISH == 'true'
        run: npm run release:check
      - name: Build and verify debug and release APKs
        if: env.FLEX_PUBLISH == 'true'
        run: npm run build
      - name: Register exact APK hashes before distribution
        if: env.FLEX_PUBLISH == 'true'
        run: npm run release:register
      - name: Read registered version
        if: env.FLEX_PUBLISH == 'true'
        id: app_version
        run: node -e 'const fs=require("fs"); const info=require("./dist/release-registration.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${info.versionName}\n`);'
      - name: Upload registered APK artifact
        if: env.FLEX_PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lexus-OBD-Flex-${{ steps.app_version.outputs.value }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/Lexus_OBD-Flex-*.apk
            dist/build-info.json
            dist/release-registration.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
