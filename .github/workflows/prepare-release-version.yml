name: Prepare Flex release version

on:
  push:
    branches: [prep/release-0.9.6]
    paths: [.github/workflows/prepare-release-version.yml]

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout prep branch
        uses: actions/checkout@v4
        with:
          ref: prep/release-0.9.6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allocate next immutable Flex version
        run: npm run version:next
      - name: Commit prepared version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Prepare Flex 0.9.6 release version"
          git push origin HEAD:prep/release-0.9.6
