name: Release lockfile sync

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

concurrency:
  group: flex-release-lock-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Sync package-lock root version only
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package missing');
          lock.version = pkg.version;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit normalized lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync lockfile version 0.9.4"
          git push origin HEAD:${GITHUB_REF_NAME}
